# Added by Foodini 2026-08-22. Per foodini-quality-manager
# knowledge/standards/secret-scanning.md.
#
# Per-clone opt-in: run `pre-commit install` after cloning. That is exactly why
# the CI gate in .github/workflows/secret-scan.yml also exists — a hook nobody
# installed protects nobody.
#
# The gitleaks hook auto-discovers .gitleaks.toml from the repo root (it is
# invoked without --config). Re-verify that if the hook's entry line changes
# upstream.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
