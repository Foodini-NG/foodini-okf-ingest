# Modified by Foodini 2026-08-22: reduced from five per-language jobs (python,
# rust, cpp, matlab, R CMD check) to the Python job alone, on 3.14, and the
# console script renamed from `okf` to `okf-ingest`. Derived from okf-ingest by
# Travis Jakel (Apache-2.0) — see NOTICE.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.17"
      - name: Provision Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Create the venv and install
        # A venv, not --system: the runner's system interpreter is Debian's 3.12
        # and is externally managed, so --system both targets the wrong version
        # and is refused. Putting .venv/bin on PATH makes `python` and the
        # `okf-ingest` console script resolve to it for every later step.
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e ".[html]"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Conformance suite
        run: |
          python --version
          python conformance/check_py.py
      - name: CLI smoke
        run: |
          okf-ingest validate conformance/bundles/store
          okf-ingest ingest conformance/bundles/store --db /tmp/kb.duckdb
          okf-ingest query /tmp/kb.duckdb --search revenue
          okf-ingest html conformance/bundles/store --out /tmp/site --json
          okf-ingest html conformance/bundles/store --single /tmp/bundle.html
          test -f /tmp/site/index.html && test -f /tmp/site/metrics/revenue.html && test -f /tmp/bundle.html
          grep -q 'href="../orders.html"' /tmp/site/metrics/revenue.html
          grep -q 'Linked from:' /tmp/site/orders.html
          okf-ingest graph conformance/bundles/store --out /tmp/graph.html && test -f /tmp/graph.html
          okf-ingest export conformance/bundles/store | python -c "import sys,json; d=json.load(sys.stdin); assert d['nodes'] and d['edges']"
          okf-ingest impact conformance/bundles/store orders.md | grep 'inbound' >/dev/null
          okf-ingest ingest conformance/bundles/store --db /tmp/inc.duckdb >/dev/null
          okf-ingest ingest conformance/bundles/store --db /tmp/inc.duckdb --incremental --json | grep '"cached"' >/dev/null
          okf-ingest export conformance/bundles/store --mermaid | grep 'graph LR' >/dev/null
          okf-ingest doctor conformance/bundles/store | grep 'health:' >/dev/null
          okf-ingest diff conformance/bundles/diff_a conformance/bundles/diff_a | grep 'identical' >/dev/null
          okf-ingest rank conformance/bundles/store orders.md | grep 'customers.md' >/dev/null
          okf-ingest context conformance/bundles/store --query 'revenue orders' 2>/dev/null | grep 'Revenue' >/dev/null
          okf-ingest validate docs/okf-bundle --strict      # dogfood bundle stays conformant
          okf-ingest doctor docs/okf-bundle --strict         # …and healthy (100/100)
