# Added by Foodini 2026-08-22. Per foodini-quality-manager
# knowledge/standards/secret-scanning.md: this repo is public and our
# reproductions derive from a private bundle, so the tree is scanned on every
# push and pull request.
#
# `gitleaks dir` (tree), not `gitleaks git` (history) — the imported upstream
# history is not ours to rewrite, and a permanently-red check is a check
# everyone learns to ignore. The question that matters is whether a secret is in
# the code we ship. --redact so a finding is never printed into an Actions log.
#
# gitleaks-action@v2 is NOT used: it requires a GITLEAKS_LICENSE secret for
# org-owned repos. The pinned release binary is verified against the digest
# below, which is pinned here rather than read from the release's own
# checksums.txt — a checksums file published alongside a tampered artifact would
# agree with it.
name: secret-scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          set -euo pipefail
          TARBALL="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$TARBALL" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${TARBALL}"
          echo "${GITLEAKS_SHA256}  ${TARBALL}" | sha256sum -c -
          tar -xzf "$TARBALL" gitleaks
          ./gitleaks version
      - name: Scan the tree
        run: ./gitleaks dir . --config .gitleaks.toml --redact
